# SwiftFormat owns layout and spacing; disable SwiftLint rules that duplicate it, so
# `swiftformat` and SwiftLint never fight over the same line.
#
# Restored after the 1.4.0 release removed it along with the docs it was listed with: without it
# SwiftLint ran on its defaults (48 errors, `L` among them), so Swift quality failed on every
# change and stopped meaning anything.
disabled_rules:
  - closing_brace
  - colon
  - comma
  - empty_parentheses_with_trailing_closure
  - function_name_whitespace
  - leading_whitespace
  - opening_brace
  - redundant_void_return
  - return_arrow_whitespace
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - vertical_whitespace
  - void_return

included:
  - Sources
  - Tests

# Severity choices, kept visible rather than silenced:
# - Short names in closures and tuples are idiomatic Swift; `L` is the localisation helper.
# - Length limits point at real debt (large types and files that a planned split would address).
#   They warn, so they show up in every run without failing CI. Remove the warning when the split lands.
identifier_name:
  min_length: 1
  excluded:
    - L
    - id
# Ratchet: warn at the recommended limit, fail only past the current largest size, so the
# debt is visible on every run and can't grow unnoticed. Lower the error limits as it shrinks.
file_length:
  warning: 1000
  # DashboardViewModelTests.swift, the largest: 2079 lines at its peak, 1970 since the third-party
  # tap tests moved out. Lowered to match, as the ratchet asks.
  error: 1970
type_body_length:
  warning: 350
  # DashboardViewModelTests' main struct: 1242 at its peak, 1132 now. Lowered to match.
  error: 1132
line_length:
  warning: 200
  error: 260
