name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
  # The Release workflow runs this same job before it builds anything, so a release is tested the
  # way every commit is — not by a second copy of these steps that could drift from this one.
  workflow_call:
    inputs:
      ref:
        description: "What to check out (a tag, for a release). Empty means the triggering ref."
        type: string
        default: ""

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run in progress moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    # GitHub ships macOS 27 only as the Xcode 27 image (arm64); there is no `macos-27` label.
    runs-on: xcode-27
    # Without this, a hung `swift test` run (seen twice now — once for 6h, GitHub's
    # own default job timeout, once needing a manual cancel at 34m) burns runner
    # minutes silently instead of failing fast and visibly. The full suite finishes
    # in ~2s locally; 15m leaves enormous headroom for CI overhead while still
    # catching a hang in a reasonable time.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build
        run: swift build

      - name: Unit tests
        # Integration tests touch real brew — skip in CI.
        #
        # BREWMENU_DATA_DIR isolates this run: without it, code that doesn't take an injectable
        # `directory:` (StatusChecker's direct `BrewLogger.shared.log(...)` calls, hit from most
        # StatusCheckerTests) would fall through to the real `~/Library/Logs/BrewMenu` path on the
        # runner. A test run without it now gets a temporary folder of its own anyway
        # (`BrewMenuDataRoots.environmentOverride`); this keeps it in one known place.
        #
        # --no-parallel: this job has hung silently several times (see the comment on
        # `timeout-minutes` above) with the suite's own `.timeLimit`/`.serialized`
        # traits never catching it — strong evidence the whole process stalls, not one
        # test, meaning it's resource contention from everything running concurrently
        # (confirmed locally: --no-parallel genuinely serializes instead of
        # interleaving, 10.8s vs ~2s — a cheap trade if it buys reliability). If this
        # stops the hangs, that confirms concurrency load as the cause even without
        # pinning the exact resource; if it still hangs serialized, that points at the
        # runner/environment itself instead.
        #
        # --xunit-output: one result per test, kept below — what failed, and how long each took,
        # without rerunning the suite to find out.
        run: |
          mkdir -p "$RUNNER_TEMP/test-results"
          swift test --filter BrewMenuTests --no-parallel --xunit-output "$RUNNER_TEMP/test-results/tests.xml"
        env:
          BREWMENU_DATA_DIR: ${{ runner.temp }}/brewmenu-test-data

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 14
