name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"

jobs:
  build:
    name: Build & test
    runs-on: macos-26
    # Without this, a hung `swift test` run (seen twice now — once for 6h, GitHub's
    # own default job timeout, once needing a manual cancel at 34m) burns runner
    # minutes silently instead of failing fast and visibly. The full suite finishes
    # in ~2s locally; 15m leaves enormous headroom for CI overhead while still
    # catching a hang in a reasonable time.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Unit tests
        # Integration tests touch real brew — skip in CI.
        #
        # BREWMENU_DATA_DIR isolates this run the same way AGENTS.md says any manual
        # verification run should be: without it, code that doesn't take an injectable
        # `directory:` (StatusChecker's direct `BrewLogger.shared.log(...)` calls, hit
        # from most StatusCheckerTests) falls through to the real
        # `~/Library/Logs/BrewMenu` path on the runner — a single real actor + real
        # disk I/O that every test run under Swift Testing's default parallelism can
        # end up serializing behind, unlike every other store here, which already
        # takes a throwaway `directory:` per test.
        run: swift test --filter BrewMenuTests
        env:
          BREWMENU_DATA_DIR: ${{ runner.temp }}/brewmenu-test-data
