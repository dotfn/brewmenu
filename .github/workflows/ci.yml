name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"

jobs:
  build:
    name: Build & test
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Unit tests
        # Integration tests touch real brew — skip in CI.
        run: swift test --filter BrewMenuTests
