# Xcode project for the UI tests. SwiftPM stays the source of truth for the library and unit tests;
# this file only wraps the app so XCUITest can launch it. Regenerate with `xcodegen generate`.
name: BrewMenu
options:
  bundleIdPrefix: com.brewmenu
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  BrewCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/BrewCore
  BrewMenu:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - BrewCore
          - Info.plist
          - Resources
      - path: Sources/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewmenu.app
        # Read the existing plist; never let XcodeGen write it (it would drop keys).
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: BrewCore
  BrewMenuUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/BrewMenuUITests
        excludes:
          - Fixtures/**
    dependencies:
      - target: BrewMenu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewmenu.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BrewMenu:
    build:
      targets:
        BrewMenu: all
        BrewMenuUITests: all
    test:
      targets:
        - BrewMenuUITests
